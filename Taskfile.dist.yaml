# GitHub security dashboard: Rust workspace (crates/*) + SvelteKit UI (web/).
# Local overrides go into a gitignored Taskfile.yaml.
# https://taskfile.dev
version: '3'

dotenv:
  - .env

vars:
  PROFILE: '{{ .PROFILE | default "debug" }}'
  PROFILE_FLAG: '{{ if eq .PROFILE "release" }}--release{{ end }}'
  PROFILE_DIR: '{{ if eq .PROFILE "release" }}release{{ else }}debug{{ end }}'
  CONFIG: '{{ .CONFIG | default "config.toml" }}'

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  setup:
    desc: Create a local config.toml from the example
    status:
      - test -f {{.CONFIG}}
    cmds:
      - cp config.example.toml {{.CONFIG}}
      - echo "Created {{.CONFIG}}; set GITHUB_TOKEN in .env (see .env.example) or your shell."

  build:
    desc: Build the workspace (PROFILE=release for an optimized binary)
    preconditions:
      - &cargo
        sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - cargo build --workspace --all-targets {{.PROFILE_FLAG}}

  run:
    desc: Run the server (collector + API + UI)
    preconditions:
      - *cargo
      - sh: test -f {{.CONFIG}}
        msg: "{{.CONFIG}} not found — run: task setup"
    cmds:
      - cargo run {{.PROFILE_FLAG}} --bin server -- --config {{.CONFIG}} {{.CLI_ARGS}}

  test:
    desc: Run all tests
    aliases: [t]
    preconditions:
      - *cargo
    env:
      RUST_LOG: '{{ .RUST_LOG | default "off" }}'
    cmds:
      - cargo test --workspace {{.CLI_ARGS}}

  fmt:
    desc: Format all code
    aliases: [format]
    preconditions:
      - *cargo
    cmds:
      - cargo fmt --all

  lint:
    desc: Lint all code (warnings are errors)
    preconditions:
      - *cargo
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  lint:fix:
    desc: Apply clippy suggestions and reformat
    aliases: [fix]
    preconditions:
      - *cargo
    cmds:
      - cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged
      - task: fmt

  check:
    desc: All static checks (format, lint)
    cmds:
      - cargo fmt --all --check
      - task: lint

  ci:
    desc: Everything CI runs (checks + tests)
    cmds:
      - task: check
      - task: test

  docs:
    desc: Build API docs for the workspace
    preconditions:
      - *cargo
    cmds:
      - cargo doc --workspace --no-deps

  docs:open:
    desc: Build and open API docs
    preconditions:
      - *cargo
    cmds:
      - cargo doc --workspace --no-deps --open

  clean:
    desc: Remove build artifacts
    status:
      - test ! -d target
    cmds:
      - cargo clean
