# GitHub security dashboard: Rust workspace (crates/*) + SvelteKit UI (web/).
# Local overrides go into a gitignored Taskfile.yaml.
# https://taskfile.dev
version: '3'

dotenv:
  - .env

includes:
  web:
    taskfile: web/Taskfile.dist.yaml
    dir: web

vars:
  PROFILE: '{{ .PROFILE | default "debug" }}'
  PROFILE_FLAG: '{{ if eq .PROFILE "release" }}--release{{ end }}'
  CONFIG: '{{ .CONFIG | default "config.toml" }}'
  # The compose database (task db:up); override for another server.
  DATABASE_URL_PG: '{{ .DATABASE_URL_PG | default "postgres://dashboard:dashboard@127.0.0.1:54329/dashboard" }}'

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  setup:
    desc: Create config.toml and .env from the examples, install UI dependencies
    cmds:
      - task: setup:config
      - task: web:install

  setup:config:
    internal: true
    status:
      - test -f {{.CONFIG}}
      - test -f .env
    cmds:
      - test -f {{.CONFIG}} || cp config.example.toml {{.CONFIG}}
      - test -f .env || cp .env.example .env
      - echo "Edit {{.CONFIG}} (owners to track) and .env (GITHUB_TOKEN)."

  dev:
    desc: Run the server and the Vite dev server side by side (UI on :5173)
    deps: [run, web:dev]

  run:
    desc: Run the server (collector + API + UI on :8080)
    preconditions:
      - &cargo
        sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
      - &config
        sh: test -f {{.CONFIG}}
        msg: "{{.CONFIG}} not found — run: task setup"
    cmds:
      - cargo run {{.PROFILE_FLAG}} --bin server -- --config {{.CONFIG}} {{.CLI_ARGS}}

  collect:
    desc: Run the collector once and exit
    preconditions:
      - *cargo
      - *config
    cmds:
      - cargo run {{.PROFILE_FLAG}} --bin server -- --config {{.CONFIG}} --once

  digest:send:
    desc: Send the digest to all targets now, regardless of the schedule
    preconditions:
      - *cargo
      - *config
    cmds:
      - cargo run {{.PROFILE_FLAG}} --bin server -- --config {{.CONFIG}} --send-digest

  build:
    desc: Build the workspace (PROFILE=release for optimized code)
    preconditions:
      - *cargo
    cmds:
      - cargo build --workspace --all-targets {{.PROFILE_FLAG}}

  build:release:
    desc: Build the UI and a release server binary with the UI embedded
    deps: [web:build]
    preconditions:
      - *cargo
    cmds:
      - cargo build --release --bin server
      - echo "Binary at target/release/server"

  test:
    desc: Run all tests (Rust + UI)
    aliases: [t]
    preconditions:
      - *cargo
    env:
      RUST_LOG: '{{ .RUST_LOG | default "off" }}'
    cmds:
      - cargo test --workspace {{.CLI_ARGS}}
      - task: web:test

  test:postgres:
    desc: Run the storage contract tests against PostgreSQL (needs task db:up)
    preconditions:
      - *cargo
      - &psql
        sh: command -v psql
        msg: "psql not found — install the PostgreSQL client (e.g. postgresql-client)"
      - sh: psql "{{.DATABASE_URL_PG}}" -c 'select 1' >/dev/null 2>&1
        msg: "PostgreSQL not reachable at {{.DATABASE_URL_PG}} — run: task db:up"
    env:
      DATABASE_URL_PG: '{{.DATABASE_URL_PG}}'
    cmds:
      - cargo test -p store --features postgres {{.CLI_ARGS}}

  db:up:
    desc: Start the development PostgreSQL (127.0.0.1:54329)
    preconditions:
      - &docker
        sh: command -v docker
        msg: "docker not found — install from https://docker.com"
    cmds:
      - docker compose up -d --wait postgres
      - 'echo "PostgreSQL ready: {{.DATABASE_URL_PG}}"'

  db:down:
    desc: Stop the development PostgreSQL (keeps its data)
    preconditions:
      - *docker
    cmds:
      - docker compose down

  docker:build:
    desc: Build the container image (scratch, static musl server, SBOM at /server.cdx.json)
    preconditions:
      - *docker
    vars:
      IMAGE: '{{ .IMAGE | default "github-security-dashboard:dev" }}'
    cmds:
      - docker buildx build --load -t {{.IMAGE}} {{.CLI_ARGS}} .

  docker:sbom:
    desc: Write the image's CycloneDX SBOM to sbom/server.cdx.json
    preconditions:
      - *docker
    cmds:
      - docker buildx build --target sbom --output sbom {{.CLI_ARGS}} .

  db:psql:
    desc: Open psql on the development PostgreSQL
    interactive: true
    preconditions:
      - *psql
    cmds:
      - psql "{{.DATABASE_URL_PG}}"

  fmt:
    desc: Format all code
    aliases: [format]
    preconditions:
      - *cargo
    cmds:
      - cargo fmt --all
      - task: web:fmt

  lint:
    desc: Lint all code (warnings are errors)
    preconditions:
      - *cargo
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings
      - task: web:lint

  lint:actions:
    desc: Lint the GitHub workflows with actionlint and zizmor (pinned images, via docker)
    # Same gates as the Workflow lint workflow: any actionlint error, and
    # zizmor findings of medium severity or above, fail. Keep the images in
    # step with .github/workflows/workflow-lint.yml. zizmor's online audits
    # need a token: `GH_TOKEN=$(gh auth token) task lint:actions`; without
    # one it audits offline.
    preconditions:
      - sh: command -v docker
        msg: "docker not found — install from https://docker.com"
    vars:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
    cmds:
      - |
        online="--offline"; token=""
        if [ -n "${GH_TOKEN:-}" ]; then online=""; token="-e GH_TOKEN"; fi
        status=0
        docker run --rm -v "$PWD:/repo:ro" -w /repo {{.ACTIONLINT_IMAGE}} || status=1
        docker run --rm $token -v "$PWD:/repo:ro" -w /repo {{.ZIZMOR_IMAGE}} \
          --no-progress --min-severity medium $online . || status=1
        exit $status

  lint:fix:
    desc: Apply lint fixes and reformat
    aliases: [fix]
    preconditions:
      - *cargo
    cmds:
      - cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged
      - cargo fmt --all
      - task: web:lint:fix

  check:
    desc: All static checks (format, lint, type-check)
    preconditions:
      - *cargo
    cmds:
      - cargo fmt --all --check
      - task: lint
      - task: web:check

  ci:
    desc: Everything CI runs (checks + tests + UI build)
    cmds:
      - task: check
      - task: test
      - task: web:build

  docs:
    desc: Build API docs for the workspace
    preconditions:
      - *cargo
    cmds:
      - cargo doc --workspace --no-deps

  docs:open:
    desc: Build and open API docs
    preconditions:
      - *cargo
    cmds:
      - cargo doc --workspace --no-deps --open

  clean:
    desc: Remove build artifacts (Rust + UI)
    deps: [web:clean]
    cmds:
      - cargo clean
