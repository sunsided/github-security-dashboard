name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only: CI needs no secrets and writes nothing back.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: task ci + PostgreSQL contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # rustup comes with the runner; no action to pin and keep current.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # Yarn 4 is pinned in web/package.json (packageManager) and provided
      # through corepack.
      - name: Enable corepack
        run: corepack enable

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task ci
        run: task ci

      # The task checks that the database is reachable first, so these tests
      # can't pass by skipping.
      # Only this step sees the database URL: with it in the job environment,
      # task ci's workspace test run would run the PostgreSQL tests as well.
      - name: task test:postgres
        run: task test:postgres
        env:
          DATABASE_URL_PG: postgres://dashboard:dashboard@127.0.0.1:54329/dashboard

  # Builds the release image without pushing it, so a change that breaks the
  # Dockerfile fails here rather than at the next tag. Its cache has a scope
  # of its own: the release workflow never builds from layers a CI run wrote.
  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max
