name: Release image

# Publishes ghcr.io/<owner>/<repo> for version tags, or on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build, push and attest image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Signing attestations with the workflow's OIDC identity (Sigstore).
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 tags as 1.2.3, 1.2 and 1 (no "latest" for pre-releases);
      # manual runs as the branch name. Every image also gets sha-<commit>.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=github-security-dashboard
            org.opencontainers.image.licenses=EUPL-1.2

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attested separately below, with the workflow's identity.
          provenance: false
          sbom: false

      # The same SBOM the image carries at /server.cdx.json; the build cache
      # makes this a copy, not a rebuild.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: sbom
          outputs: type=local,dest=sbom
          cache-from: type=gha

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom/server.cdx.json
          push-to-registry: true

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/server.cdx.json
