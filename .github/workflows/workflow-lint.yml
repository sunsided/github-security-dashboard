name: Workflow lint

# Lints the workflows with actionlint (syntax, expressions, shellcheck on
# `run:` scripts) and audits them with zizmor (script injection, token
# permissions, unpinned or dangerous actions). zizmor's findings, at every
# severity, are filed under code scanning; the check fails on any actionlint
# error and on zizmor findings of medium severity or above. `task lint:actions`
# runs the same gates locally.
#
# Path-filtered, so it only runs when a workflow or Dependabot's config
# changes, which includes Dependabot's action bumps.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new release can't turn a green branch red without a commit.
  # Keep in step with the lint:actions task.
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Each error becomes an annotation on the line it concerns.
      - name: Lint workflows
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/repo:ro -w /repo "$ACTIONLINT_IMAGE" \
            -format "$ANNOTATIONS"
        env:
          ANNOTATIONS: '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}\n{{end}}'

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Filing the findings under code scanning.
      security-events: write
      # The SARIF upload reads this run's own metadata through the Actions API.
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Every severity goes to code scanning; --no-exit-codes so the report
      # never fails, the gate below decides. The token is for the online
      # audits (known-vulnerable or impostor actions, ref confusion).
      - name: Audit workflows
        run: |
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE":/repo:ro -w /repo "$ZIZMOR_IMAGE" \
            --format sarif --no-progress --no-exit-codes . > "$RUNNER_TEMP/zizmor.sarif"
        env:
          GH_TOKEN: ${{ github.token }}

      # A pull request from a fork gets a read-only token, which can't write
      # security events. It is audited anyway; only the upload is skipped.
      - name: File findings under code scanning
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor

      - name: Fail on medium or higher
        run: |
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE":/repo:ro -w /repo "$ZIZMOR_IMAGE" \
            --format github --no-progress --min-severity medium .
        env:
          GH_TOKEN: ${{ github.token }}
