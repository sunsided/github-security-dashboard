# Copy to config.toml (gitignored), or run: task setup

# The API is unauthenticated; keep it on loopback unless something in front
# of it handles authentication.
listen = "127.0.0.1:8080"

# Requests are only answered for localhost, 127.0.0.1 and [::1] (protects
# against DNS rebinding). Add the hostname here if a proxy forwards others.
allowed_hosts = []

# Time between collector runs (humantime syntax: "15m", "1h 30m", ...).
poll_interval = "30m"

[storage]
# SQLite file, or PostgreSQL for long-term retention of the audit history:
# url = "postgres://dashboard:dashboard@127.0.0.1:54329/dashboard"  (task db:up)
url = "sqlite://dashboard.db"

[auth]
# Name of the environment variable holding a personal access token. Required
# unless a GitHub App is configured below; with an App, it is used for owners
# the App is not installed on (e.g. external repositories), if set.
# Permissions (fine-grained, read-only): Metadata, Contents, Issues,
# Pull requests, Dependabot alerts, Code scanning alerts, Secret scanning
# alerts.
token_env = "GITHUB_TOKEN"

# Authenticate as a GitHub App instead (same read-only permissions as above).
# [auth.app]
# app_id = 123456                    # or the client ID, "Iv23..."
# private_key_path = "github-app.pem" # relative to this file; *.pem is gitignored
# private_key_env = "GITHUB_APP_PRIVATE_KEY"  # alternatively, the PEM itself

[collector]
# Organizations and users whose own repositories are tracked.
owners = ["sunsided"]
# Further repositories, as "owner/name".
external_repos = []
# Repositories per GraphQL page. Counting commit history is expensive for
# large repositories; lower this if GitHub reports timeouts.
page_size = 25
# Parallel REST requests.
concurrency = 8

[collector.alerts]
# Alert sources to collect.
sources = ["dependabot", "code_scanning", "secret_scanning"]
# Per-repository requests cost three calls per repository and run; skip
# repositories that rarely matter. Organization-wide requests are not
# affected and always cover everything.
skip_archived = true
skip_forks = true
# GitHub gives leaked secrets no severity; this is the one they get here.
secret_severity = "critical"

[collector.osv]
# Repositories whose Dependabot alerts the token can't read (typically
# external ones) get estimated alerts: dependencies from GitHub's SBOM export
# checked against https://osv.dev. Marked "estimated" in the UI.
enabled = true
# "external", or "without_dependabot" to include tracked repositories with
# Dependabot disabled.
scope = "external"
api_url = "https://api.osv.dev"

[scoring]
# Risk score = sum of open alerts weighted by severity.
critical = 10
high = 5
medium = 2
low = 1

[digest]
# A daily summary of what changed: alerts opened or reopened, severities
# raised, alerts closed, and the current totals. Nothing is sent on days
# without changes. Every request is a CloudEvent (binary mode: ce-* headers),
# so Knative Eventing and other CloudEvents consumers can take it as-is.
enabled = false
at = "08:00"
timezone = "Europe/Berlin"
# Linked from the digest; omit if the dashboard isn't reachable for readers.
# dashboard_url = "https://security.example.org"
# CloudEvents attributes: ce-source, and the ce-type prefix (".digest.v1" for
# JSON, ".digest.slack.v1" for Slack, ".digest.teams.v1" for Teams is appended).
event_source = "/github-security-dashboard"
event_type_prefix = "io.github.sunsided.security-dashboard"
# Alerts listed per section before "...and N more".
max_items = 15

# Webhook URLs are secrets; each target names the variable that holds it.
# [[digest.targets]]
# name = "slack"
# kind = "slack"            # Slack incoming webhook (Block Kit message)
# url_env = "SLACK_WEBHOOK_URL"
#
# [[digest.targets]]
# name = "teams"
# kind = "teams"            # Teams Workflows webhook (Adaptive Card), from the
#                           # template "Post to a channel when a webhook request
#                           # is received"
# url_env = "TEAMS_WEBHOOK_URL"
#
# [[digest.targets]]
# name = "events"
# kind = "json"             # any webhook, the digest as JSON
# url_env = "DIGEST_WEBHOOK_URL"

[realtime]
# Live updates for the UI over a WebSocket. A client gets a short-lived
# connection token from POST /api/realtime/token (an HS256 JWT in
# Centrifugo's format) and sends it as its first message.
token_ttl = "5m"
# Time a client has to send its token after connecting.
connect_timeout = "10s"
# Environment variable with the signing key (32+ bytes), e.g. to share it with
# Centrifugo's token_hmac_secret_key. Without it, a random key per process.
# signing_key_env = "REALTIME_SIGNING_KEY"
