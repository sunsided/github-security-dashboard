# Copy to config.toml (gitignored), or run: task setup

# The API is unauthenticated; keep it on loopback unless something in front
# of it handles authentication.
listen = "127.0.0.1:8080"

# Requests are only answered for localhost, 127.0.0.1 and [::1] (protects
# against DNS rebinding). Add the hostname here if a proxy forwards others.
allowed_hosts = []

# Time between collector runs (humantime syntax: "15m", "1h 30m", ...).
poll_interval = "30m"

[storage]
url = "sqlite://dashboard.db"

[auth]
# Name of the environment variable holding a personal access token. Required
# unless a GitHub App is configured below; with an App, it is used for owners
# the App is not installed on (e.g. external repositories), if set.
# Permissions (fine-grained, read-only): Metadata, Contents, Issues,
# Pull requests, Dependabot alerts, Code scanning alerts, Secret scanning
# alerts.
token_env = "GITHUB_TOKEN"

# Authenticate as a GitHub App instead (same read-only permissions as above).
# [auth.app]
# app_id = 123456                    # or the client ID, "Iv23..."
# private_key_path = "github-app.pem" # relative to this file; *.pem is gitignored
# private_key_env = "GITHUB_APP_PRIVATE_KEY"  # alternatively, the PEM itself

[collector]
# Organizations and users whose own repositories are tracked.
owners = ["sunsided"]
# Further repositories, as "owner/name".
external_repos = []
# Repositories per GraphQL page. Counting commit history is expensive for
# large repositories; lower this if GitHub reports timeouts.
page_size = 25
# Parallel REST requests.
concurrency = 8

[collector.alerts]
# Alert sources to collect.
sources = ["dependabot", "code_scanning", "secret_scanning"]
# Per-repository requests cost three calls per repository and run; skip
# repositories that rarely matter. Organization-wide requests are not
# affected and always cover everything.
skip_archived = true
skip_forks = true
# GitHub gives leaked secrets no severity; this is the one they get here.
secret_severity = "critical"

[collector.osv]
# Repositories whose Dependabot alerts the token can't read (typically
# external ones) get estimated alerts: dependencies from GitHub's SBOM export
# checked against https://osv.dev. Marked "estimated" in the UI.
enabled = true
# "external", or "without_dependabot" to include tracked repositories with
# Dependabot disabled.
scope = "external"
api_url = "https://api.osv.dev"

[scoring]
# Risk score = sum of open alerts weighted by severity.
critical = 10
high = 5
medium = 2
low = 1
