[workspace]
resolver = "3"
members = ["crates/gh", "crates/store", "crates/collector", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
repository = "https://github.com/sunsided/github-security-dashboard"
authors = ["Markus Mayer <sunside227@gmail.com>"]
publish = false

[workspace.dependencies]
gh = { path = "crates/gh" }
store = { path = "crates/store", default-features = false }
collector = { path = "crates/collector" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
humantime-serde = "1.1.1"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "macros", "migrate", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
